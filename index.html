body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#e8f0ff,#fff6d6);color:var(--tx);min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:480px;padding:16px}
.s{display:none;animation:in .3s}.s.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 6px 20px #1e6bff22;margin-bottom:12px}
h1,h2{margin:6px 0;text-align:center}
h1{font-size:2rem;color:var(--b)}
button{font:inherit;border:0;border-radius:16px;padding:14px;width:100%;margin:5px 0;background:var(--b);color:#fff;font-weight:700;cursor:pointer}
button.alt{background:#fff;color:var(--tx);border:2px solid #d5def5;text-align:left}
button.y{background:var(--y);color:#14213d}
button:active{transform:scale(.97)}
input,select{font:inherit;width:100%;padding:12px;border-radius:14px;border:2px solid #d5def5;margin:5px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{text-align:center;padding:18px 6px}
.bot{display:block;margin:0 auto;width:120px;animation:fl 2.5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.bubble{background:#fff8d9;border-radius:16px;padding:10px 14px;text-align:center;font-weight:600;margin:6px 0}
.bar{height:10px;border-radius:9px;background:#dbe4fb;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--y);transition:width 1s linear}
.top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.ok{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important}
.ko{background:var(--ko)!important;color:#fff!important;border-color:var(--ko)!important}
.big{font-size:3rem;text-align:center;font-weight:800;color:var(--b)}
.badge{display:inline-block;background:var(--y);border-radius:12px;padding:6px 10px;margin:3px;font-weight:700}
.jump{text-align:center;animation:jp .7s}.shake{animation:sk .5s}.jump .bot,.shake .bot{animation:none}
@keyframes jp{0%,100%{transform:translateY(0)}35%{transform:translateY(-22px) rotate(-6deg)}65%{transform:translateY(-10px) rotate(6deg)}}
@keyframes sk{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.lang{display:flex;gap:6px}.lang button{padding:8px;margin:0}
